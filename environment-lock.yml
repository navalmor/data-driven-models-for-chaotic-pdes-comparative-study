# Tested environment for
#   "Optimized Data-Driven Models for PDEs: A Comparative Study" (Kuramoto-Sivashinsky).
#
# This records the environment used to produce the tested GPU checkpoints. The conda
# layer provides PyTorch and the CUDA stack; the pip subsection provides the scientific
# stack (numpy, scipy, scikit-learn, scikit-optimize, matplotlib) that was installed on
# top of it. numpy is pinned to 1.26.4 in the pip subsection and intentionally overrides
# the conda numpy 2.2.5, which is the effective (validated) version. See docs/environment.md.
#
# PyTorch here is built against CUDA 12.6 (torch.version.cuda), while the conda toolkit
# packages are CUDA 12.8; these are distinct. For a plain CPU install without the CUDA
# stack, use requirements.txt with a standard Python 3.12 virtual environment instead.
#
# Recreate with:  conda env create -f environment-lock.yml

